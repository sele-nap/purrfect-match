spring:
  datasource:
    url: jdbc:h2:mem:purrfect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
  jpa:
    show-sql: true

logging:
  level:
    io.github.selenap.purrfectmatch: DEBUG
